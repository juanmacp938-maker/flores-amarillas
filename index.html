<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <style>
        body {
            background-color: #111;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            margin: 0;
            font-family: 'Arial', sans-serif;
            overflow: hidden;
        }
        /* Animación de la flor */
        .flower {
            position: relative;
            animation: bounce 3s ease-in-out infinite;
        }
        /* Centro del Girasol */
        .center {
            width: 80px;
            height: 80px;
            background: radial-gradient(#4a2c00, #271400);
            border-radius: 50%;
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            z-index: 10;
            box-shadow: inset 0 0 10px rgba(0,0,0,0.8);
        }
        /* Pétalos Amarillos Realistas */
        .petal {
            position: absolute;
            width: 35px;
            height: 110px;
            background: linear-gradient(to top, #ffcc00, #ffea00);
            border-radius: 50% 50% 50% 50% / 60% 60% 40% 40%;
            top: -55px;
            left: -17.5px;
            transform-origin: bottom center;
            box-shadow: 0 0 10px rgba(0,0,0,0.2);
        }
        /* Generar la forma circular con 12 pétalos */
        .p1 { transform: rotate(0deg); }
        .p2 { transform: rotate(30deg); }
        .p3 { transform: rotate(60deg); }
        .p4 { transform: rotate(90deg); }
        .p5 { transform: rotate(120deg); }
        .p6 { transform: rotate(150deg); }
        .p7 { transform: rotate(180deg); }
        .p8 { transform: rotate(210deg); }
        .p9 { transform: rotate(240deg); }
        .p10 { transform: rotate(270deg); }
        .p11 { transform: rotate(300deg); }
        .p12 { transform: rotate(330deg); }

        /* Tallo */
        .stem {
            width: 12px;
            height: 180px;
            background: linear-gradient(to right, #4caf50, #2e7d32);
            position: absolute;
            top: 40px;
            left: -6px;
            border-radius: 4px;
            z-index: 1;
        }
        /* Mensaje de texto */
        .text {
            color: #ffd700;
            font-size: 24px;
            margin-top: 360px;
            text-shadow: 0 0 10px rgba(255,215,0,0.5);
            font-weight: bold;
            text-align: center;
            animation: fadeIn 2s ease-in;
        }
        @keyframes bounce {
            0%, 100% { transform: translateY(0) rotate(-2deg); }
            50% { transform: translateY(-10px) rotate(2deg); }
        }
        @keyframes fadeIn {
            from { opacity: 0; }
            to { opacity: 1; }
        }
    </style>
</head>
<body>

    <div class="flower">
        <div class="center"></div>
        <div class="petal p1"></div>
        <div class="petal p2"></div>
        <div class="petal p3"></div>
        <div class="petal p4"></div>
        <div class="petal p5"></div>
        <div class="petal p6"></div>
        <div class="petal p7"></div>
        <div class="petal p8"></div>
        <div class="petal p9"></div>
        <div class="petal p10"></div>
        <div class="petal p11"></div>
        <div class="petal p12"></div>
        <div class="stem"></div>
    </div>

    <div class="text">¡Estas flores amarillas reales son para ti! 💛</div>

</body>
</html>
